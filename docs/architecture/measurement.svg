<svg xmlns="http://www.w3.org/2000/svg" width="1142" height="860" viewBox="0 0 1142 860" role="img" aria-label="Each model sees only the 1,095 days before each of 964 weekly origins, refits every fourth origin, forecasts 14 days of quantiles, and is scored by CRPS and pinball against actuals with a moving block bootstrap over origins; headroom report writes the README tables from the stored forecasts." font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
